version: 2

# Grouped, weekly, and only patch/minor auto-merge candidates are labelled for review —
# a shell that pins WinAppSDK cannot take surprise majors.

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      windows-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK"
          - "Microsoft.Windows.SDK.BuildTools"
      test-and-tooling:
        patterns:
          - "Microsoft.NET.Test.*"
          - "CommunityToolkit.*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
