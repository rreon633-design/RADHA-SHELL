name: ci

# RADHA SHELL — continuous integration
#
# What this pipeline proves on every push:
#   1. core      — the portable engine (palettes, config, IPC, CLI) builds and all assertions pass
#   2. invariant — the repo contains no HTML/CSS/JS (the "native only" contract from the PRD)
#   3. xaml      — every .xaml / .csproj / manifest is well-formed XML
#   4. winui     — the WinUI 3 app compiles on real Windows (this is the honest gate for UI code)
#   5. native    — the C++/WinRT bridge compiles with MSVC
#   6. shaders   — every HLSL file compiles to a pixel shader
#
# Jobs 1–3 run on Linux (fast, always available). Jobs 4–6 run on Windows and are the
# ones that exercise the unverified-as-of-phase-1 code.

permissions:
  contents: read

on:
  # Nightly safety net: WinAppSDK and the Windows SDK move under us, so a green build today
  # can be red tomorrow with no commit of ours.
  schedule:
    - cron: '23 3 * * *'
  # No paths-ignore: every push to main runs the full gate. A docs-only change still
  # proves the tree is buildable, and it keeps the ci → release chain unconditional.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ---------------------------------------------------------------- core
  core:
    name: core · build + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        # Restoring the test project also restores Core via ProjectReference.
        run: dotnet restore src/Radha.Tests/Radha.Tests.csproj

      - name: Build (warnings as errors)
        run: |
          dotnet build src/Radha.Tests/Radha.Tests.csproj -c Release --no-restore \
            -p:TreatWarningsAsErrors=true

      - name: Run test suite
        run: dotnet run --project src/Radha.Tests -c Release --no-build | tee core-tests.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-logs
          path: |
            core-tests.log
            palette.json
            err.txt
          retention-days: 7

  # ----------------------------------------------------------- invariants
  invariants:
    name: invariants · native-only + xml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: No web tech in the shell
        run: |
          # The PRD forbids HTML/CSS/JS/Electron/Tauri for the shell itself.
          # docs may mention them; source may not contain them.
          offenders=$(find src -type f \( -name '*.html' -o -name '*.htm' -o -name '*.css' \
                        -o -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \
                        -o -name 'package.json' -o -name 'vite.config.*' \) || true)
          if [ -n "$offenders" ]; then
            echo "Forbidden web artefacts found in src/:"; echo "$offenders"; exit 1
          fi
          if find src -name '*.csproj' -exec grep -l 'UseWPF\|Electron\|WebView2' {} \; | grep -q .; then
            echo "Forbidden UI framework reference found"; exit 1
          fi
          echo "native-only invariant holds"

      - name: Validate XML (xaml, csproj, props, manifest)
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = (glob.glob("src/**/*.xaml", recursive=True)
                   + glob.glob("src/**/*.csproj", recursive=True)
                   + glob.glob("src/**/*.props", recursive=True)
                   + glob.glob("src/**/*.manifest", recursive=True) + glob.glob("src/**/*.appxmanifest", recursive=True))
          bad = []
          for f in files:
              try:
                  ET.parse(f)
              except Exception as e:
                  bad.append((f, e))
          for f, e in bad:
              print(f"INVALID {f}: {e}")
          print(f"checked {len(files)} files, {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY

      - name: Validate JSON (configs, workflows)
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob("examples/*.json") + glob.glob("**/*.json", recursive=True)
          bad = []
          for f in set(files):
              if "bin/" in f or "obj/" in f:
                  continue
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append((f, e))
          for f, e in bad:
              print(f"INVALID {f}: {e}")
          print(f"checked {len(set(files))} json files, {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY


  # ------------------------------------------------------------- security
  security:
    name: security · secrets + deps + policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Scan for committed secrets
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          patterns = {
              "GitHub fine-grained PAT": r"github_pat_[A-Za-z0-9_]{20,}",
              "GitHub classic token":    r"gh[pousr]_[A-Za-z0-9]{20,}",
              "OpenAI key":              r"sk-[A-Za-z0-9\-_]{20,}",
              "AWS access key":          r"AKIA[0-9A-Z]{16}",
              "private key block":       r"-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "Slack token":             r"xox[baprs]-[A-Za-z0-9\-]{10,}",
              "Google API key":          r"AIza[0-9A-Za-z\-_]{35}",
          }

          tracked = subprocess.check_output(["git", "ls-files"], text=True).split()
          offenders = []
          for path in tracked:
              try:
                  text = open(path, encoding="utf-8", errors="ignore").read()
              except (IsADirectoryError, FileNotFoundError):
                  continue
              for name, pattern in patterns.items():
                  for match in re.finditer(pattern, text):
                      # Redactor test fixtures use an obviously fake suffix.
                      if "REDACTED" in match.group(0) or "example" in match.group(0).lower():
                          continue
                      offenders.append((path, name, match.group(0)[:12] + "…"))

          for path, name, preview in offenders:
              print(f"::error file={path}::{name} looks committed ({preview})")
          print(f"scanned {len(tracked)} files, {len(offenders)} finding(s)")
          sys.exit(1 if offenders else 0)
          PY

      - name: Vulnerability scan (NuGet)
        run: |
          dotnet restore src/Radha.Core/Radha.Core.csproj
          vulnerable=$(dotnet list src/Radha.Core/Radha.Core.csproj package --vulnerable --include-transitive 2>/dev/null | grep -c "> " || true)
          echo "core: $vulnerable flagged package line(s)"
          # Core has no package references by design; the WinUI project is scanned below.
          dotnet restore src/Radha.App/Radha.App.csproj 2>/dev/null || echo "winui restore unavailable on linux (checked on windows job)"

      - name: Verify dependency surface of Core is empty
        run: |
          count=$(grep -c "PackageReference" src/Radha.Core/Radha.Core.csproj || true)
          echo "Radha.Core PackageReference count: $count"
          test "$count" -eq 0 || { echo "::error::Radha.Core must stay dependency-free"; exit 1; }

      - name: Check no build output or binaries are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(bin|obj)/|\.(dll|exe|pdb|zip|cso)$' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::build output tracked"; exit 1; fi
          echo "no build output tracked"

      - name: Check file size ceiling
        run: |
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && s=$(stat -c%s "{}") && [ "$s" -gt 2097152 ] && echo "{} $s"' || true)
          if [ -n "$big" ]; then echo "$big"; echo "::error::file larger than 2 MiB"; exit 1; fi
          echo "all tracked files under 2 MiB"


  # ---------------------------------------------------------- performance
  performance:
    name: performance · p95 budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build src/Radha.Tests/Radha.Tests.csproj -c Release

      - name: Run benchmarks (fails on regression)
        run: |
          dotnet run --project src/Radha.Tests -c Release --no-build -- bench --gate | tee bench.txt
          dotnet run --project src/Radha.Tests -c Release --no-build -- bench --json > bench.json
          echo "### Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bench.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarks
          path: |
            bench.txt
            bench.json
          retention-days: 14


  # ----------------------------------------------------------------- docs
  docs:
    name: docs · completeness + links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Required PRD documents exist
        run: |
          required="docs/README.md
          docs/01-problem-statement.md
          docs/02-aim-vision.md
          docs/03-objectives.md
          docs/04-target-audience.md
          docs/05-tech-stack.md
          docs/06-architecture.md
          docs/07-design-philosophy.md
          docs/08-features.md
          docs/09-novel-features.md
          docs/10-backend-services.md
          docs/11-api-ipc.md
          docs/12-workflow.md
          docs/13-setup-installation.md
          docs/14-development-process.md
          docs/15-phasewise-plan.md
          docs/16-performance.md
          docs/17-security.md
          docs/18-maintenance.md
          docs/19-problematic-areas.md
          docs/20-risk-factors.md
          docs/21-advantages.md
          docs/22-future-scope.md
          docs/23-success-metrics.md
          docs/24-appendix.md
          docs/ARCHITECTURE.md
          docs/BUILD.md
          docs/ROADMAP.md
          SECURITY.md
          CONTRIBUTING.md
          CHANGELOG.md
          LICENSE"
          missing=0
          for f in $required; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=$((missing+1)); fi
          done
          echo "checked $(echo "$required" | wc -w) documents, $missing missing"
          test "$missing" -eq 0

      - name: Validate internal markdown links
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = []
          for root, _, files in os.walk("."):
              if "/.git" in root or "/bin" in root or "/obj" in root:
                  continue
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  path = os.path.join(root, f)
                  text = open(path, encoding="utf-8", errors="ignore").read()
                  for target in re.findall(r"\[[^\]]+\]\(([^)#]+)(?:#[^)]*)?\)", text):
                      if target.startswith(("http://", "https://", "mailto:", "#")):
                          continue
                      resolved = os.path.normpath(os.path.join(root, target))
                      if not os.path.exists(resolved):
                          bad.append((path, target))
          for path, target in bad:
              print(f"::error file={path}::broken link → {target}")
          print(f"{len(bad)} broken link(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Lock screen must stay out of the codebase
        run: |
          # Product decision: no lock screen / credential provider / biometric auth.
          hits=$(grep -rniE 'credential ?provider|windows hello|fprintd|howdy|lock ?screen' src --include=*.cs --include=*.xaml || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::lock-screen code found (out of scope)"; exit 1; fi
          echo "no lock-screen implementation present"

  # ------------------------------------------------------- app typecheck
  # The WinUI XAML compiler is a Windows-only executable, so a full Radha.App build cannot run
  # off-Windows. These two jobs close most of that gap on Linux: the XAML is audited statically
  # (x:Class ⇄ code-behind, handlers, resources, bindings) and every line of App C# is compiled
  # against the real WinUI/WinRT reference assemblies with XAML-generated members stubbed out.
  # The windows `winui` job stays the authoritative check (XAML compile + MSIX packaging).
  xaml-audit:
    name: xaml · static audit (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Build auditor
        run: dotnet build tools/XamlAudit -c Release --nologo
      - name: Audit XAML against code-behind
        run: dotnet run --project tools/XamlAudit -c Release --no-build

  app-typecheck:
    name: app · typecheck against winui (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile every Radha.App .cs against WinUI reference assemblies
        # Stubs for XAML-generated members are produced by tools/TypeCheck/generate-stubs.py
        # from the .xaml files during the build; Windows-only PRI/MSIX targets stay disabled.
        run: >-
          dotnet build tools/TypeCheck/Radha.App.TypeCheck.csproj
          -c Release -p:Platform=x64 --nologo
      - name: Confirm the type-check assembly was produced
        run: |
          dll=$(find tools/TypeCheck/bin -name 'Radha.App.TypeCheck.dll' -print -quit)
          test -n "$dll" || { echo "::error::Radha.App did not type-check (no assembly)"; exit 1; }
          echo "type-checked $(stat -c%s "$dll") bytes of IL from $(find src/Radha.App -name '*.cs' | wc -l) source files"

  # --------------------------------------------------------------- winui
  winui:
    name: winui · compile shell (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore src/Radha.App/Radha.App.csproj -p:Platform=x64

      # Job logs need repo admin, but ::error annotations are public. Capture the failure three
      # ways: explicit error lines, the XAML compiler's output.json, then the raw log tail.
      - name: Build WinUI shell
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'winui-build.log'
          dotnet build src/Radha.App/Radha.App.csproj -c Release -p:Platform=x64 --no-restore -p:TreatWarningsAsErrors=false -v:n 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Host "build clean"; exit 0 }

          function Announce([string[]]$lines) {
            $lines | Select-Object -First 20 | ForEach-Object {
              $m = $_.Replace('%', '%25').Replace([string][char]13, '').Replace([string][char]10, '%0A')
              if ($m.Trim()) { Write-Host "::error file=src/Radha.App::$m" }
            }
          }

          $errs = @(Select-String -Path $log -Pattern ': error |error [A-Z]{1,4}[0-9]{3,4}|Unhandled exception|XamlCompiler\.exe' |
                    ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)

          if ($errs.Count -gt 0) {
            Announce $errs
          } else {
            # Silent crash: show the last lines of the log so the stack/failure is visible.
            $ojs = @(Get-ChildItem src/Radha.App/obj -Recurse -Filter output.json -ErrorAction SilentlyContinue)
            $tail = @(Get-Content $log) | Select-Object -Last 30
            Announce (@("NO ERROR LINE MATCHED — raw log tail follows ($($tail.Count) lines), output.json found: $($ojs.Count)") + $tail)
          }
          Write-Host "::error::dotnet build exited $code"
          exit $code

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Radha.App-win-x64
          path: src/Radha.App/bin/x64/Release/**
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------- native
  native:
    name: native · c++ bridge (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -S src/Radha.Native -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Verify export surface
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter RadhaNative.dll | Select-Object -First 1
          if (-not $dll) { throw "RadhaNative.dll was not produced" }
          Write-Host "built $($dll.FullName) ($([math]::Round($dll.Length/1kb)) KB)"

          # The C# side P/Invokes these by name — a missing export is a silent runtime failure.
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $exports = & $dumpbin.FullName /nologo /exports $dll.FullName
          $expected = @(
            'RadhaAppBarRegister','RadhaAppBarSetPosition','RadhaAppBarUnregister',
            'RadhaSetClickThrough','RadhaEnableBlurBehind','RadhaSetMica','RadhaSetTopMost',
            'RadhaHotkeyRegister','RadhaHotkeyUnregister','RadhaHotkeySetPipeEndpoint',
            'RadhaWorkspaceBuild','RadhaWorkspaceBackend','RadhaWorkspaceCount',
            'RadhaWorkspaceCurrent','RadhaWorkspaceSwitch','RadhaWorkspaceMoveActiveWindow')
          $missing = $expected | Where-Object { -not ($exports -match "\b$_\b") }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::missing export $_" }
            throw "$($missing.Count) export(s) missing"
          }
          Write-Host "all $($expected.Count) exports present"

      # Real runtime check: loads the DLL and drives the virtual-desktop ABI on actual Windows.
      # Advisory, not gating: GitHub runners are session 0 with no Explorer, so the live shell
      # interface cannot exist here — the meaningful assertions for that path can only run on a
      # desktop. What this still proves: the binary starts, the ABI is safe on the unsupported
      # path, and boundary calls do not fault. Failures are annotated loudly.
      - name: Virtual desktop smoke test (advisory)
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            $exe = Get-ChildItem build -Recurse -Filter RadhaNativeSmoke.exe -ErrorAction Stop | Select-Object -First 1
            if (-not $exe) { Write-Host "::warning::RadhaNativeSmoke.exe was not produced"; exit 0 }
            $dll = Get-ChildItem build -Recurse -Filter RadhaNative.dll | Select-Object -First 1
            Copy-Item $dll.FullName (Split-Path $exe.FullName) -Force

            $out = & $exe.FullName 2>&1 | Out-String
            Write-Host $out
            $code = $LASTEXITCODE
            ($out -split [string][char]10) | Where-Object { $_ -match 'FAIL|checks,|build=' } | ForEach-Object {
              $m = $_.Trim()
              if ($m) { Write-Host "::warning::$m" }
            }
            if ($code -ne 0) { Write-Host "::warning::smoke test exited $code (advisory on a session-0 runner)" }
          } catch {
            Write-Host "::warning::smoke test could not run: $($_.Exception.Message)"
          }

      - name: Upload bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RadhaNative-win-x64
          path: build/Release/RadhaNative.dll
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------- shaders
  shaders:
    name: shaders · hlsl compile (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile with fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          Write-Host "using $($fxc.FullName)"

          New-Item -ItemType Directory -Force -Path out\shaders | Out-Null
          $failed = 0
          Get-ChildItem src\Radha.Shaders\*.hlsl | ForEach-Object {
            $out = "out\shaders\$($_.BaseName).cso"
            & $fxc.FullName /nologo /T ps_5_0 /E main /Fo $out $_.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAILED $($_.Name)" -ForegroundColor Red
              $failed++
            } else {
              Write-Host "OK $($_.Name) → $([math]::Round((Get-Item $out).Length/1kb)) KB"
            }
          }
          if ($failed -gt 0) { throw "$failed shader(s) failed to compile" }

      - name: Upload compiled shaders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shaders-cso
          path: out/shaders/*.cso
          retention-days: 7

  # --------------------------------------------------------------- gate
  ci-gate:
    name: ci · all checks
    needs: [core, invariants, security, performance, docs, xaml-audit, app-typecheck, winui, native, shaders]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results=("${{ needs.core.result }}" "${{ needs.invariants.result }}" \
                   "${{ needs.security.result }}" "${{ needs.performance.result }}" "${{ needs.docs.result }}" \
                   "${{ needs.xaml-audit.result }}" "${{ needs.app-typecheck.result }}" \
                   "${{ needs.winui.result }}" "${{ needs.native.result }}" "${{ needs.shaders.result }}")
          echo "core=${results[0]} invariants=${results[1]} security=${results[2]} performance=${results[3]} docs=${results[4]} xaml-audit=${results[5]} app-typecheck=${results[6]} winui=${results[7]} native=${results[8]} shaders=${results[9]}"
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all checks passed"
