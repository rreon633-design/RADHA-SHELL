name: release

# RADHA SHELL — continuous delivery
#
# Ships ONE artefact a person can double-click: RadhaShell.exe. Self-contained and single-file, so
# it needs no .NET install, no Windows App SDK redistributable and no unzipping.
#
# Every green `ci` on main publishes a rolling development build; a version tag publishes a real one.
# The binary is not released until it has been executed on the runner and passed `--selftest`.

on:
  # 0. nightly safety net: a green build today can go red with no code change
  schedule:
    - cron: '17 4 * * *'
  # 1. a version tag ships a real release
  push:
    tags: ['v*.*.*']
  # 2. every green `ci` on main ships a rolling development build — no clicks, no dispatch
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # 3. manual override
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for a manual build (e.g. v0.1.0-dev)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    # The only job that needs to write: it creates the release and attests the artifact.
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: build release artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    # A workflow_run fires for failed CI too — only ship when every gate passed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      # tag push → the tag name; auto-chain → v0.0.0-dev.<ci run number>; manual → the input
      # NB: must not be called VERSION — MSBuild maps env vars to properties and the
      # 'Version' property rejects a leading 'v' ("'v0.0.0-dev.9' is not a valid version string").
      RELEASE_VERSION: >-
        ${{
          github.event_name == 'push' && github.ref_name ||
          github.event_name == 'workflow_run' && format('v0.0.0-dev.{0}', github.event.workflow_run.run_number) ||
          github.event.inputs.version
        }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run checks out the default branch by default; pin to the commit CI built
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Run core tests before shipping
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'tests.log'
          dotnet build src/Radha.Tests/Radha.Tests.csproj -c Release -v:q 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $be = @(Select-String -Path $log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            $be | Select-Object -First 15 | ForEach-Object { Write-Host "::error::$_" }
            Write-Host "::error::tests failed to build"; exit 1
          }
          dotnet run --project src/Radha.Tests -c Release --no-build 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $fails = @(Select-String -Path $log -Pattern 'FAIL ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            $fails | Select-Object -First 15 | ForEach-Object {
              $m = $_.Replace('%','%25').Replace([string][char]13,'').Replace([string][char]10,'%0A')
              Write-Host "::error::$m"
            }
            $sum = @(Select-String -Path $log -Pattern 'passed, .* failed' | Select-Object -Last 1)
            Write-Host "::error::test suite exited $code ($($sum.Line.Trim()))"
            exit $code
          }

      # The native bridge has to exist *before* publish, otherwise the single-file bundle has no
      # RadhaNative.dll in it and app-bar docking, DWM effects and global hotkeys silently disappear.
      - name: Build native bridge
        shell: pwsh
        run: |
          cmake -B build -S src/Radha.Native -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          New-Item -ItemType Directory -Force -Path src/Radha.App/native | Out-Null
          Copy-Item build/Release/RadhaNative.dll src/Radha.App/native/RadhaNative.dll -Force
          Get-Item src/Radha.App/native/RadhaNative.dll | Select-Object Name, Length

      # Same reason: Anything in Assets/ is published as content, so the shaders must be there first.
      - name: Compile shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          New-Item -ItemType Directory -Force -Path src/Radha.App/Assets/shaders | Out-Null
          Get-ChildItem src\Radha.Shaders\*.hlsl | ForEach-Object {
            & $fxc.FullName /nologo /T ps_5_0 /E main /Fo "src\Radha.App\Assets\shaders\$($_.BaseName).cso" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "shader $($_.Name) failed" }
          }
          Get-ChildItem src/Radha.App/Assets/shaders

      - name: Publish single-file shell
        shell: pwsh
        run: |
          # MSBuild's Version property rejects a leading 'v', so strip the tag prefix.
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $log = Join-Path $env:RUNNER_TEMP 'publish.log'
          dotnet publish src/Radha.App/Radha.App.csproj `
            -c Release -p:Platform=x64 -r win-x64 --self-contained true `
            -p:WindowsAppSDKSelfContained=true -p:RadhaSingleFile=true `
            -p:Version=$version `
            -o publish/exe -v:q 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $errs = @(Select-String -Path $log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
          $errs | Select-Object -First 15 | ForEach-Object {
            $m = $_.Replace('%', '%25').Replace([string][char]13, '').Replace([string][char]10, '%0A')
            Write-Host "::error file=src/Radha.App::$m"
          }
          if ($code -ne 0) { Write-Host "::error::publish exited $code with $($errs.Count) error line(s)"; exit $code }
          if (-not (Test-Path publish/exe/RadhaShell.exe)) { throw "RadhaShell.exe was not produced" }
          Get-Item publish/exe/RadhaShell.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # An unpackaged WinUI app loads App.xaml through a file named resources.pri and nothing else.
      # MSBuild names it after the assembly by default, which produced RadhaShell.pri and a window
      # that never appeared. This check reads the bundle's own file table: if the name is wrong the
      # rest of the pipeline is pointless, so it fails here rather than after a 100 MB upload.
      - name: Verify the bundle carries resources.pri
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/exe/RadhaShell.exe).Path
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($exe))
          $hasResourcePri = $text.Contains('resources.pri')
          $hasWrongPri = $text.Contains('RadhaShell.pri')
          Write-Host "resources.pri in bundle : $hasResourcePri"
          Write-Host "RadhaShell.pri in bundle: $hasWrongPri"
          if (-not $hasResourcePri) { Write-Host '::error::the bundle has no resources.pri, so XAML will not load'; exit 1 }
          if ($hasWrongPri) { Write-Host '::error::the bundle still carries RadhaShell.pri; ProjectPriFileName is not taking effect'; exit 1 }

      # THE GATE. A release that cannot start is worse than no release: run the actual published
      # binary and only continue if it passes its own headless checks.
      - name: Self-test the published executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/exe/RadhaShell.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'selftest.json'
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest", "--out", "`"$out`"" -PassThru -Wait
          Write-Host "self-test exited $($proc.ExitCode)"
          if (Test-Path "$out.txt") { Get-Content "$out.txt" }
          if (-not (Test-Path $out)) { Write-Host "::error::the executable produced no self-test report"; exit 1 }
          if ($proc.ExitCode -ne 0) { Write-Host "::error::the published executable failed its self-test"; exit 1 }
          Get-Content $out

      # THE REAL GATE. --selftest returns before XAML starts, which is why it passed on a build
      # that could not open a window. This one starts the shell for real: it must build the App,
      # parse the resource index, create the bar window and report back. A windowless WinExe is
      # indistinguishable from a crash, so nothing ships until a window exists.
      - name: Smoke-test a real window
        id: smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/exe/RadhaShell.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          Write-Host "starting $exe --smoke"
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke', '--out', "`"$out`"", '--timeout', '120' -PassThru
          $exited = $proc.WaitForExit(180000)
          if (-not $exited) { Stop-Process -Id $proc.Id -Force }
          $code = if ($exited) { $proc.ExitCode } else { -1 }
          Write-Host "smoke exited $code (exited=$exited)"
          "SMOKE_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SMOKE_EXITED=$exited" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Everything that can explain a windowless launch, in one place, whether it passed or not.
      # The step summary is the only channel that survives to a reader without a login.
      - name: Collect launch diagnostics
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'diagnostics'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $summary = @("# RadhaShell launch diagnostics", '', "smoke exit code: $env:SMOKE_CODE (exited: $env:SMOKE_EXITED)", '')

          foreach ($name in @('smoke.json')) {
            $src = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $src) { Copy-Item $src $dir; $summary += @("## $name", '```json', (Get-Content $src -Raw), '```') }
            else { $summary += "## $name — not produced" }
          }

          $logs = Join-Path $env:APPDATA 'Radha\logs'
          if (Test-Path $logs) {
            Get-ChildItem $logs -File | ForEach-Object {
              Copy-Item $_.FullName $dir
              $summary += @("## $($_.Name)", '```', (Get-Content $_.FullName -Raw), '```')
            }
          } else { $summary += '## no %APPDATA%\Radha\logs directory was created' }

          # --diagnose is headless, so it always answers even when the window cannot exist.
          $exe = (Resolve-Path publish/exe/RadhaShell.exe).Path
          $diag = Join-Path $env:RUNNER_TEMP 'diagnose.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--diagnose', '--out', "`"$diag`"" -PassThru
          $p.WaitForExit(60000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $diag) { Copy-Item $diag $dir; $summary += @('## --diagnose', '```', (Get-Content $diag -Raw), '```') }

          $summary += @('## session', '```', "user: $env:USERNAME", "session: $((Get-Process -Id $PID).SessionId)", "os: $((Get-CimInstance Win32_OperatingSystem).Caption)", '```')
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($env:SMOKE_CODE -ne '0') {
            Write-Host "::error::the shell could not open a window (exit $env:SMOKE_CODE); see the job summary"
            exit 1
          }

      - name: Upload launch diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launch-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RadhaShell-win-x64
          path: publish/exe/RadhaShell.exe
          retention-days: 30

      - name: Attest the executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: publish/exe/RadhaShell.exe

      - name: Write checksums
        shell: pwsh
        run: |
          Push-Location publish/exe
          Get-FileHash RadhaShell.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-Content publish/exe/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: RADHA SHELL ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            publish/exe/RadhaShell.exe
            publish/exe/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-dev') }}
          generate_release_notes: true
          body: |
            ## RADHA SHELL ${{ env.RELEASE_VERSION }}

            Native Windows shell: WinUI 3 · Composition · Win2D · HLSL · C++/WinRT.
            **No HTML/CSS/JS.**

            ### Download

            **`RadhaShell.exe`** — that is the whole install. One file, self-contained: no .NET
            runtime, no Windows App SDK redistributable, nothing to unzip. Put it anywhere and run it.

            Unsigned development build — Windows SmartScreen will ask for confirmation the first
            time (More info → Run anyway). Verify the download against `SHA256SUMS.txt`.

            ### What was verified before this was published

            - the published `RadhaShell.exe` **was executed on a Windows runner and passed its
              self-test**; a binary that cannot start is never released
            - 539 core assertions on Linux
            - XAML audit: every handler, resource key and binding resolves
            - `Radha.App` type-checked against the WinUI reference assemblies
            - C++/WinRT bridge and HLSL shaders compiled on the release runner

            ### First run

            The bar appears at the top of the primary display. Right-click the tray icon and choose
            **Settings** — every option (appearance, density, motion, bar, notifications, launcher,
            OSD, services, wallpaper layer, power) is in that window. The JSON in
            `%APPDATA%\Radha\shell.json` is the same data, if you prefer to edit it.

            No lock screen; no Explorer replacement.
