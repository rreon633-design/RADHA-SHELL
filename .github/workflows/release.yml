name: release

# RADHA SHELL — continuous delivery
#
# Triggered by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces a GitHub Release containing the compiled shell, the native bridge and the
# compiled shaders, plus the palette CLI. No signing yet — artifacts are unsigned
# development builds and must say so.

on:
  # 0. nightly safety net: a green build today can go red with no code change
  schedule:
    - cron: '17 4 * * *'
  # 1. a version tag ships a real release
  push:
    tags: ['v*.*.*']
  # 2. every green `ci` on main ships a rolling development build — no clicks, no dispatch
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # 3. manual override
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for a manual build (e.g. v0.1.0-dev)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    # The only job that needs to write: it creates the release and attests the artifact.
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: build release artifacts
    runs-on: windows-latest
    timeout-minutes: 40
    # A workflow_run fires for failed CI too — only ship when every gate passed.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      # tag push → the tag name; auto-chain → v0.0.0-dev.<ci run number>; manual → the input
      # NB: must not be called VERSION — MSBuild maps env vars to properties and the
      # 'Version' property rejects a leading 'v' ("'v0.0.0-dev.9' is not a valid version string").
      RELEASE_VERSION: >-
        ${{
          github.event_name == 'push' && github.ref_name ||
          github.event_name == 'workflow_run' && format('v0.0.0-dev.{0}', github.event.workflow_run.run_number) ||
          github.event.inputs.version
        }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run checks out the default branch by default; pin to the commit CI built
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Run core tests before shipping
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'tests.log'
          dotnet build src/Radha.Tests/Radha.Tests.csproj -c Release -v:q 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $be = @(Select-String -Path $log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            $be | Select-Object -First 15 | ForEach-Object { Write-Host "::error::$_" }
            Write-Host "::error::tests failed to build"; exit 1
          }
          dotnet run --project src/Radha.Tests -c Release --no-build 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $fails = @(Select-String -Path $log -Pattern 'FAIL ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
            $fails | Select-Object -First 15 | ForEach-Object {
              $m = $_.Replace('%','%25').Replace([string][char]13,'').Replace([string][char]10,'%0A')
              Write-Host "::error::$m"
            }
            $sum = @(Select-String -Path $log -Pattern 'passed, .* failed' | Select-Object -Last 1)
            Write-Host "::error::test suite exited $code ($($sum.Line.Trim()))"
            exit $code
          }

      - name: Publish WinUI shell
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'publish.log'
          dotnet publish src/Radha.App/Radha.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o publish/app -v:q 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $errs = @(Select-String -Path $log -Pattern ': error ' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique)
          $errs | Select-Object -First 15 | ForEach-Object {
            $m = $_.Replace('%', '%25').Replace([string][char]13, '').Replace([string][char]10, '%0A')
            Write-Host "::error file=src/Radha.App::$m"
          }
          if ($code -ne 0) { Write-Host "::error::publish exited $code with $($errs.Count) error line(s)"; exit $code }

      - name: Publish CLI
        run: >
          dotnet publish src/Radha.Cli/Radha.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -o publish/cli

      - name: Build native bridge
        run: |
          cmake -B build -S src/Radha.Native -A x64
          cmake --build build --config Release
          Copy-Item build/Release/RadhaNative.dll publish/app/ -Force

      - name: Compile shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
                 Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path publish/app/assets | Out-Null
          Get-ChildItem src\Radha.Shaders\*.hlsl | ForEach-Object {
            & $fxc.FullName /nologo /T ps_5_0 /E main /Fo "publish\app\assets\$($_.BaseName).cso" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "shader $($_.Name) failed" }
          }

      - name: Add config sample + notice
        shell: pwsh
        run: |
          Copy-Item examples/shell.json publish/app/shell.sample.json
          @"
          RADHA SHELL — unsigned development build
          ========================================
          Run:      Radha.App.exe
          Control:  cli\radha.exe dashboard toggle
          Config:   %APPDATA%\Radha\shell.json  (see shell.sample.json)

          No lock screen. No Explorer replacement. See docs/ROADMAP.md.
          "@ | Set-Content publish/app/BUILD-NOTICE.txt -Encoding utf8

      - name: Compose archive
        shell: pwsh
        run: Compress-Archive -Path publish/app/*, publish/cli/* -DestinationPath RadhaShell-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RadhaShell-win-x64
          path: RadhaShell-win-x64.zip
          retention-days: 30

      - name: Create GitHub release
        name: Attest the artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: RadhaShell-win-x64.zip

      - name: Write checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash RadhaShell-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  RadhaShell-win-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: RADHA SHELL ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            RadhaShell-win-x64.zip
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(env.RELEASE_VERSION, '-dev') }}
          generate_release_notes: true
          body: |
            ## RADHA SHELL ${{ env.RELEASE_VERSION }}

            Native Windows shell: WinUI 3 · Composition · Win2D · HLSL · C++/WinRT.
            **No HTML/CSS/JS.**

            ### Verified in this build
            - core palette engine, config store, IPC protocol, CLI — 235 assertions passed
            - XAML audit: every handler, resource key and binding resolves
            - `Radha.App` C# type-checked against the WinUI reference assemblies
            - WinUI 3 app + C++/WinRT bridge + HLSL shaders compiled on Windows

            ### Contents
            | Path | What |
            |---|---|
            | `Radha.App.exe` | the shell (bar, dashboard, launcher, control centre, OSD) |
            | `cli/radha.exe` | command-line control (`radha dashboard toggle`) |
            | `RadhaNative.dll` | app-bar docking, DWM effects, global hotkeys |
            | `assets/*.cso` | compiled shaders |
            | `shell.sample.json` | configuration reference |

            Unsigned development build. No lock screen; no Explorer replacement.
